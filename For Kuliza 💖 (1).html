<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Kuliza 💖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@600&family=Great+Vibes&family=Lobster&family=Satisfy&family=Caveat:wght@700&family=Sacramento&family=Parisienne&family=Kaushan+Script&family=Playfair+Display:ital,wght@1,700&family=Righteous&family=Yellowtail&family=Courgette&family=Hind+Siliguri:wght@500&display=swap">
<style>
:root{--b1:#ff8fc2;--b2:#b388ff;--b3:#ffb48a;--ink:#fff;--paper:#fff8f2;--pen:#7a2e4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#e0529a;--b2:#7e57c2;--b3:#e8896a}}
:root[data-theme="dark"]{--b1:#e0529a;--b2:#7e57c2;--b3:#e8896a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(125deg,var(--b1),var(--b2),var(--b3),var(--b1));background-size:400% 400%;animation:bg 16s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(50px);opacity:.55;animation:orb 14s ease-in-out infinite alternate}
.o1{width:50vmax;height:50vmax;left:-15vmax;top:-10vmax;background:#ff5fa2}
.o2{width:45vmax;height:45vmax;right:-12vmax;bottom:-10vmax;background:#9d6bff;animation-delay:-5s}
.o3{width:30vmax;height:30vmax;left:30%;top:35%;background:#ffd1a1;animation-delay:-9s;opacity:.35}
@keyframes orb{to{transform:translate(8vmax,6vmax) scale(1.25)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#sky{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fl{position:absolute;white-space:nowrap;will-change:transform;line-height:1.2}
.fl .t.grad{background-image:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3s linear infinite}
.fl.pill{padding:.25em .8em;border-radius:40px;background:#ffffff2e;border:1px solid #ffffff66;backdrop-filter:blur(6px)}
.fl .t.flick{opacity:1}
@keyframes shim{to{background-position:200% 0}}
@keyframes flick{0%,18%,22%,60%,100%{opacity:1}20%,24%{opacity:.55}}
#center{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transform:scale(.7);transition:opacity 1.4s,transform 1.4s cubic-bezier(.2,1.4,.4,1)}
#center.in{opacity:1;transform:none}
.ring{position:absolute;width:44vmin;height:44vmin;border-radius:50%;border:2px solid #fff9;animation:ring 4s ease-out infinite}
.ring:nth-child(2){animation-delay:1.3s}.ring:nth-child(3){animation-delay:2.6s}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
#bh{font-size:clamp(46px,14vmin,92px);animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 0 18px #ff2e7e)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#nm{font:clamp(70px,24vw,190px)/1 "Great Vibes",cursive;margin:0;background:linear-gradient(90deg,#fff,#ffd1e8,#ffe9a8,#fff,#ffd1e8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite;filter:drop-shadow(0 4px 18px #c2185bcc)}
#sub{font:clamp(20px,6vw,38px) "Pacifico",cursive;text-shadow:0 0 16px #ff2e7e,0 0 34px #ff2e7e;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(-6px)}}
#tag{margin-top:12px;font:clamp(15px,4vw,22px) "Dancing Script",cursive;letter-spacing:.06em;opacity:.95;text-shadow:0 2px 10px #8a1450}
#wm{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:6;text-align:center;font:12px "Dancing Script",cursive;letter-spacing:.12em;opacity:.6;pointer-events:none;text-shadow:0 1px 4px #0006}
#again{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:6;font-size:24px;background:#ffffff33;border:1px solid #fff8;border-radius:50%;width:46px;height:46px;cursor:pointer;backdrop-filter:blur(6px)}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#ff9ac8e6,#7b3fb8f0);backdrop-filter:blur(8px);transition:opacity 1s,visibility 1s;padding:20px}
#intro.hide{opacity:0;visibility:hidden}
#intro h2{margin:0 0 22px;font:clamp(34px,10vw,56px) "Great Vibes",cursive;text-shadow:0 0 20px #ff2e7e;animation:sway 3s ease-in-out infinite alternate}
#envw{text-align:center;transition:transform .8s,opacity .8s}#envw.gone{transform:scale(.3) translateY(-60px);opacity:0;pointer-events:none;position:absolute}
.env{position:relative;width:min(72vw,290px);aspect-ratio:100/90;margin:auto;cursor:pointer;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 30px #4a0f3a99) drop-shadow(0 0 22px #ff4d8d)}
.half{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .9s}
.half svg{width:100%;height:100%;display:block}
.hl{clip-path:inset(0 50% 0 0)}.hr{clip-path:inset(0 0 0 50%)}
.env.open .hl{transform:translateX(-44px) rotate(-22deg);opacity:0}
.env.open .hr{transform:translateX(44px) rotate(22deg);opacity:0}
@keyframes bob{50%{transform:translateY(-10px)}}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:40px;z-index:3;animation:beat 1.1s infinite;transition:opacity .4s}.env.open .seal{opacity:0}
.hint{margin-top:26px;font:22px "Pacifico",cursive;opacity:.95}@keyframes blink{50%{opacity:.35}}
#card{display:none;width:min(92vw,520px);max-height:76vh;overflow:auto;background:var(--paper);color:var(--pen);border-radius:20px;padding:26px 24px;box-shadow:0 20px 60px #3a0a3099;border:3px solid #ffc2d9;text-align:left}
#card.show{display:block;animation:rise .9s cubic-bezier(.2,1.2,.3,1)}
@keyframes rise{from{transform:translateY(80px) scale(.8) rotate(-3deg);opacity:0}}
#lt{margin:0;white-space:pre-wrap;font:clamp(21px,5.4vw,27px)/1.5 "Caveat","Hind Siliguri",cursive}
#enter{display:none;margin:18px auto 0;font:20px "Pacifico",cursive;padding:12px 30px;border:0;border-radius:40px;color:#fff;background:linear-gradient(90deg,#ff4d8d,#c2185b);box-shadow:0 6px 0 #8a1450;cursor:pointer}
#enter.show{display:block;animation:beat 1.3s infinite}

.rays{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;z-index:1;pointer-events:none;background:repeating-conic-gradient(from 0deg,#ffffff26 0 5deg,transparent 5deg 16deg);-webkit-mask:radial-gradient(circle,#000 4%,transparent 52%);mask:radial-gradient(circle,#000 4%,transparent 52%);animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{position:absolute;width:64vmin;height:64vmin;animation:spin 24s linear infinite}
.orbit span{position:absolute;left:50%;top:50%;font-size:clamp(18px,5vmin,30px);margin:-.5em;transform:rotate(var(--a)) translateY(-32vmin);filter:drop-shadow(0 0 8px #ff4d8d)}
.star{position:fixed;z-index:1;width:150px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;pointer-events:none;animation:shoot 7s linear infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}11%{opacity:0;transform:translate(70vw,32vw) rotate(25deg)}100%{opacity:0}}
#nm{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;animation:none}
#nm .ch{display:inline-block;background:linear-gradient(90deg,#fff,#ffd1e8,#ffe9a8,#fff,#ffd1e8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite,wave 2.4s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-.12em) rotate(4deg)}}
#poem{margin-top:16px;width:min(90vw,520px);min-height:8.6em;padding:16px 22px;border-radius:24px;background:linear-gradient(135deg,#ffffff2e,#ffffff12);border:1px solid #ffffff70;backdrop-filter:blur(12px);box-shadow:0 12px 44px #5a0f4a66,inset 0 0 22px #ffffff22;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 12px 56px #ff2e7e88,inset 0 0 30px #ffffff3a}}
#pl{margin:0;transition:opacity .7s;font:600 clamp(18px,4.8vw,25px)/1.55 "Dancing Script","Hind Siliguri",cursive;text-shadow:0 2px 12px #8a1450}
#pl span{display:block;opacity:0;filter:blur(8px);transform:translateY(12px);animation:ln 1.1s forwards}
@keyframes ln{to{opacity:1;filter:none;transform:none}}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="rays"></div><i class="star" style="top:6%;left:4%;animation-delay:1s"></i><i class="star" style="top:18%;left:30%;animation-delay:3.5s"></i><i class="star" style="top:4%;left:55%;animation-delay:5.5s"></i><i class="star" style="top:30%;left:8%;animation-delay:8s"></i><canvas id="fx"></canvas><div id="sky"></div>
<div id="center"><div class="orbit" id="orb"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
<div id="bh">💖</div><h1 id="nm">Kuliza</h1><div id="sub">I LOVE YOU SO MUCH 😘</div><div id="tag">my HUMU · my pookie · my forever</div><div id="poem"><p id="pl"></p></div></div>
<button id="again" aria-label="Read the love letter">💌</button>
<div id="wm">It’s for only my kuliza HUMU 💗</div>
<div id="intro"><h2>For my Kuliza</h2>
<div id="envw"><div class="env" id="env"><div class="half hl"><svg viewBox="0 0 100 90"><defs><linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset=".55" stop-color="#ff6b9d"/><stop offset="1" stop-color="#d81b60"/></linearGradient></defs><path d="M50 86C10 56 0 36 0 23 0 9 12 0 25 0c12 0 21 7 25 15C54 7 63 0 75 0c13 0 25 9 25 23 0 13-10 33-50 63Z" fill="url(#hg1)"/><path d="M50 86C10 56 0 36 0 23 0 9 12 0 25 0c12 0 21 7 25 15" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6"/><path d="M7 20 50 55 93 20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/></svg></div><div class="half hr"><svg viewBox="0 0 100 90"><defs><linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset=".55" stop-color="#ff6b9d"/><stop offset="1" stop-color="#d81b60"/></linearGradient></defs><path d="M50 86C10 56 0 36 0 23 0 9 12 0 25 0c12 0 21 7 25 15C54 7 63 0 75 0c13 0 25 9 25 23 0 13-10 33-50 63Z" fill="url(#hg2)"/><path d="M50 86C10 56 0 36 0 23 0 9 12 0 25 0c12 0 21 7 25 15" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6"/><path d="M7 20 50 55 93 20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/></svg></div><div class="seal">💌</div></div><div class="hint">Tap to open 💌</div></div>
<div id="card"><p id="lt"></p><button id="enter">Enter our little world 💖</button></div></div>
<script>
const $=id=>document.getElementById(id);
// ---------- love letter (edit freely) ----------
const LETTER=`My dearest Kuliza,
my HUMU, my pookie 💕

Welcome to a tiny world I made only for you. Every floating word here is my heart talking: you are my peace, my smile, and my favourite person in every universe.

Thank you for loving me, for being patient with me, and for turning my ordinary days into something magical. Whatever happens, I will always choose you.

আমি তোমাকে অনেক অনেক ভালোবাসি, কুলিজা। ❤️

My heart is a house with one bright door,
and you are the one I was waiting for.
Stay with me, love, forevermore —
I'll love you more than the day before. 💞

Forever yours,
Shuvo 😘`;
// ---------- floating words ----------
const PH='I LOVE YOU SO MUCH KULIZA 😘',EX=['Kuliza 💗','My HUMU 💞','ভালোবাসি কুলিজা 😘','Forever Yours 💍','You are my everything 🥰','Pookie ❤️','Mine forever 💖','Kuliza + Me = ∞ 💕'],EM=['🌹','🦋','💌','🧸','🌸','💍','🕊️','✨'];
const FONTS=['Pacifico','Dancing Script','Great Vibes','Lobster','Satisfy','Caveat','Sacramento','Parisienne','Kaushan Script','Playfair Display','Righteous','Yellowtail','Courgette'];
const COL=['#ff4d8d','#ff2e63','#ffd166','#c77dff','#ffb3d9','#ffffff','#ff7b9c','#7df9ff','#ffb347','#ff6ec7'];
const rnd=a=>a[Math.random()*a.length|0],small=innerWidth<600,sky=$('sky');
function floater(txt,i,emoji){
 const el=document.createElement('div'),m=txt.match(/^(.*?)\s*((?:\p{Extended_Pictographic}|\uFE0F|\u200D)+)$/u),t=document.createElement('span'),c=rnd(COL),c2=rnd(COL);
 t.className='t';el.className='fl';
 if(emoji){t.textContent=txt;el.style.fontSize=(small?26:38)+Math.random()*26+'px'}
 else{t.textContent=m?m[1]:txt;el.append(t);if(m){const e=document.createElement('span');e.textContent=' '+m[2];el.append(e)}
  const f=rnd(FONTS),k=i%6;el.style.fontFamily='"'+f+'",cursive';el.style.fontSize=(small?15:20)+Math.random()*(small?18:26)+'px';
  el.style.setProperty('--c1',c);el.style.setProperty('--c2',c2);
  if(k===0){el.style.color=c;el.style.textShadow='0 0 8px '+c+',0 0 24px '+c}
  else if(k===1)t.classList.add('grad');
  else if(k===2){t.style.color='transparent';t.style.webkitTextStroke='1.3px '+c;el.style.filter='drop-shadow(0 0 6px '+c+')'}
  else if(k===3){el.classList.add('pill');el.style.color='#fff'}
  else if(k===4){el.style.color='#fff';el.style.textShadow='0 2px 14px '+c}
  else{el.style.color='#fff';el.style.textShadow='0 0 6px #fff,0 0 14px '+c+',0 0 32px '+c;t.classList.add('flick')}
  if(Math.random()<.3)el.style.fontWeight='700'}
 if(emoji)el.append(t);
 el.style.left=Math.random()*70+'%';el.style.top=Math.random()*88+'%';sky.append(el);
 const w=()=>`translate(${(Math.random()-.5)*innerWidth*.55}px,${(Math.random()-.5)*innerHeight*.5}px) rotate(${(Math.random()-.5)*26}deg) scale(${.85+Math.random()*.4})`;
 el.animate([{transform:'none'},{transform:w()},{transform:w()},{transform:w()},{transform:w()}],{duration:16000+Math.random()*18000,iterations:Infinity,direction:'alternate',easing:'ease-in-out',delay:-Math.random()*12000})}
const N=small?20:30;for(let i=0;i<N;i++)floater(i%4===3?rnd(EX):PH,i);EM.forEach((e,i)=>floater(e,i,true));
// ---------- particles (hearts, sparkles, petals) ----------
const cv=$('fx'),ctx=cv.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const PAL=['#ff4d8d','#ff2e63','#ff9ecd','#ffd166','#c77dff','#ffffff','#ff7b9c'],ps=[];
function sp(k,x,y,vx,vy,life,b){ps.push({k,x,y,vx,vy,s:6+Math.random()*14,c:rnd(PAL),r:Math.random()*6,vr:(Math.random()-.5)*.06,a:1,life:life||9999,age:0,ph:Math.random()*6,b})}
function amb(){const q=Math.random();if(q<.55)sp('h',Math.random()*W,H+20,0,-(.5+Math.random()*1.4));else if(q<.8)sp('s',Math.random()*W,Math.random()*H,0,-.25,160+Math.random()*200);else if(q<.9)sp('p',Math.random()*W,-20,0,.6+Math.random()*1.2);else sp('b',Math.random()*W,H+60,0,-(.3+Math.random()*.6),9999)}
function burst(x,y){for(let i=0;i<30;i++){const a=Math.random()*6.28,v=2+Math.random()*5;sp(Math.random()<.25?'s':'h',x,y,Math.cos(a)*v,Math.sin(a)*v-1.5,70+Math.random()*50,1)}}
function heart(s){ctx.beginPath();ctx.moveTo(0,s*.35);ctx.bezierCurveTo(-s*1.1,-s*.35,-s*.55,-s*1.15,0,-s*.5);ctx.bezierCurveTo(s*.55,-s*1.15,s*1.1,-s*.35,0,s*.35);ctx.fill()}
function star(s){ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(0,0,s,0);ctx.quadraticCurveTo(0,0,0,s);ctx.quadraticCurveTo(0,0,-s,0);ctx.quadraticCurveTo(0,0,0,-s);ctx.fill()}
(function loop(){ctx.clearRect(0,0,W,H);if(ps.length<(small?75:140)&&Math.random()<.4)amb();
 for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.age++;
  if(p.b){p.vy+=.06;p.vx*=.985;p.a=Math.max(0,1-p.age/p.life)}else p.x+=Math.sin(p.age*.03+p.ph)*.6;
  p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
  if(p.k==='s'&&!p.b){p.a=Math.sin(Math.min(1,p.age/p.life)*Math.PI)}
  if(p.age>p.life||p.y<-40||p.y>H+40){ps.splice(i,1);continue}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.k==='h'?Math.sin(p.age*.04+p.ph)*.4:p.r);ctx.globalAlpha=p.a*(p.k==='h'?.85:.9);ctx.fillStyle=p.c;
  if(p.k==='h')heart(p.s);else if(p.k==='s')star(p.s*1.1);else if(p.k==='b'){const g=ctx.createRadialGradient(0,0,0,0,0,p.s*3);g.addColorStop(0,p.c);g.addColorStop(1,p.c+'00');ctx.globalAlpha=.3;ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.s*3,0,7);ctx.fill()}else{ctx.beginPath();ctx.ellipse(0,0,p.s*.35,p.s*.7,0,0,7);ctx.fill()}
  ctx.restore()}
 requestAnimationFrame(loop)})();
addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));
let lt=0;addEventListener('pointermove',e=>{const n=performance.now();if(n-lt>70){lt=n;sp('h',e.clientX,e.clientY,(Math.random()-.5)*.8,-1,50,1)}});
// ---------- intro / letter ----------
let ti=0,tt,done=false;
function type(){$('lt').textContent=LETTER.slice(0,++ti);if(ti<LETTER.length)tt=setTimeout(type,LETTER[ti-1]==='\n'?260:24);else{done=true;$('enter').classList.add('show')}}
$('env').onclick=()=>{$('env').classList.add('open');setTimeout(()=>{$('envw').classList.add('gone');$('card').classList.add('show');type()},900)};
$('card').onclick=e=>{if(!done&&e.target.id!=='enter'){clearTimeout(tt);ti=LETTER.length-1;type()}};
$('enter').onclick=e=>{e.stopPropagation();$('intro').classList.add('hide');$('center').classList.add('in');burst(W/2,H/2);setTimeout(()=>burst(W*.25,H*.4),250);setTimeout(()=>burst(W*.75,H*.4),500)};
$('again').onclick=()=>{$('intro').classList.remove('hide');$('envw').classList.add('gone');$('card').classList.add('show');$('lt').textContent=LETTER;done=true;$('enter').classList.add('show')};

// ---------- extra beauty: poem, letter-wave, orbit, parallax ----------
const POEM=[
["In a million faces, a million skies,","my heart still finds your eyes.","Kuliza, you are the softest light","that turned my darkest day to bright. ✨"],
["If love were stars, I'd give you all,","if love were rain, I'd let it fall","on every path your feet will roam,","and make each step feel like home. 🌙"],
["Your laughter is my favourite song,","with you, I know where I belong.","Every heartbeat calls your name,","my love for you, forever the same. 💓"],
["তুমি আমার আকাশ, তুমি আমার ভোর,","তোমার হাসিতেই আমার সুখের ঘর। 💞"],
["So here's my promise, soft and true:","in every lifetime, I'll choose you.","I love you more than words can say,","today, tomorrow, every day. 😘"]];
let pi=0,pt;
function showPoem(){const p=$('pl');p.style.opacity=0;setTimeout(()=>{p.innerHTML=POEM[pi].map((l,i)=>'<span style="animation-delay:'+i*.9+'s">'+l+'</span>').join('');p.style.opacity=1;pi=(pi+1)%POEM.length},700)}
$('enter').addEventListener('click',()=>{setTimeout(showPoem,1600);if(!pt)pt=setInterval(showPoem,10000)});
$('nm').innerHTML=[...'Kuliza'].map((c,i)=>'<span class="ch" style="animation-delay:'+i*.2+'s,'+i*.18+'s">'+c+'</span>').join('');
$('orb').innerHTML=Array.from({length:10},(_,i)=>'<span style="--a:'+i*36+'deg">'+['💖','✨','💗','🌹','💕'][i%5]+'</span>').join('');
sky.style.transition='transform .4s ease-out';
addEventListener('pointermove',e=>{const x=e.clientX/W-.5,y=e.clientY/H-.5;sky.style.transform='translate('+(-x*34)+'px,'+(-y*34)+'px)';$('center').style.translate=(x*14)+'px '+(y*14)+'px'});
</script></body></html>
